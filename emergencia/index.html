<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231e1b4b%27/%3E%3Cpath d=%27M5 17h6l3-8 4 14 3-6h6%27 fill=%27none%27 stroke=%27%2334d399%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<script src="../assets/gate.js"></script>
<title>DoseCerta · Emergência</title>
<style>
/* Layout: faixa de marca com abas; barra do paciente adulto; abaixo, a aba ativa (protocolos, infusões, calculadoras, prescrições do PS, exames). */
:root{
  --bg:#eef0f7; --surface:#ffffff; --surface-2:#f6f7fc; --line:#dde1ee; --fg:#1b1f36; --muted:#5b6382;
  --brand:#1e1b4b; --brand-2:#312e81; --on-brand:#ffffff; --on-brand-muted:#c7d2fe;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#ecebfe; --mint:#34d399;
  --sus:#047857; --sus-bg:#e2f5ec; --hosp:#0e6f86; --hosp-bg:#dff1f6; --estr:#6d28d9; --estr-bg:#efe8fd;
  --misto:#3f6212; --misto-bg:#eef6dc; --part:#a44d07; --part-bg:#fdefdc;
  --danger:#b91c1c; --danger-bg:#fdecec; --warn:#92580a; --warn-bg:#fdf4d6;
  --paper:#ffffff; --ink:#0f172a; --ink-muted:#5f6b7f; --ink-line:#e3e7ef;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1020; --surface:#171a2f; --surface-2:#1d2139; --line:#2b3052; --fg:#e7e9f4; --muted:#9aa1c0;
  --brand:#131130; --brand-2:#26236a; --on-brand:#ffffff; --on-brand-muted:#b9c0f5;
  --accent:#8b85ff; --accent-hover:#a19cff; --accent-soft:#25234e; --mint:#4ade80;
  --sus:#5fdca5; --sus-bg:#10301f; --hosp:#62c9de; --hosp-bg:#0e2c35; --estr:#b9a2ff; --estr-bg:#2a2049;
  --misto:#b5d87a; --misto-bg:#24301a; --part:#f6b05e; --part-bg:#3a2a14;
  --danger:#f87171; --danger-bg:#3a1719; --warn:#f3c94e; --warn-bg:#35290c; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1020; --surface:#171a2f; --surface-2:#1d2139; --line:#2b3052; --fg:#e7e9f4; --muted:#9aa1c0;
  --brand:#131130; --brand-2:#26236a; --on-brand:#ffffff; --on-brand-muted:#b9c0f5;
  --accent:#8b85ff; --accent-hover:#a19cff; --accent-soft:#25234e; --mint:#4ade80;
  --sus:#5fdca5; --sus-bg:#10301f; --hosp:#62c9de; --hosp-bg:#0e2c35; --estr:#b9a2ff; --estr-bg:#2a2049;
  --misto:#b5d87a; --misto-bg:#24301a; --part:#f6b05e; --part-bg:#3a2a14;
  --danger:#f87171; --danger-bg:#3a1719; --warn:#f3c94e; --warn-bg:#35290c; color-scheme:dark; }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- topo ---------- */
.topbar{background:var(--brand);color:var(--on-brand);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{background:var(--brand-2);padding:7px;border-radius:8px;display:flex}
.brand-icon svg{width:22px;height:22px;stroke:var(--mint)}
.brand-title{font-size:1.05rem;font-weight:750;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand-sub{font-size:.72rem;color:var(--on-brand-muted)}
.pill-soft{font-size:.62rem;background:rgba(52,211,153,.18);color:var(--mint);border:1px solid rgba(52,211,153,.4);padding:2px 8px;border-radius:999px;font-weight:700;letter-spacing:.02em}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:9px;flex-wrap:wrap}
.tab{background:transparent;border:0;color:var(--on-brand-muted);padding:7px 12px;font-size:.78rem;font-weight:650;border-radius:6px;cursor:pointer}
.tab:hover{color:var(--on-brand)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.top-actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:6px;font-size:.75rem;font-weight:650;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--fg)}
.btn svg{width:15px;height:15px}
.btn-on-brand{background:transparent;border-color:var(--on-brand-muted);color:var(--on-brand)}
.btn-on-brand:hover{background:var(--brand-2)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-line{background:transparent;border-color:var(--line);color:var(--accent)}
.btn-line:hover{background:var(--accent-soft)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:4px 9px;font-size:.7rem}

/* ---------- paciente ---------- */
.wrap{padding-inline:16px;padding-block:14px 40px;max-width:1500px;margin:0 auto}
.ptbar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.ptbar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ptbar-head h2{font-size:.85rem;font-weight:750;display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.pt-grid{display:grid;grid-template-columns:2fr .9fr 1.1fr .9fr .9fr;gap:10px}
.pt-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
label{display:block;font-weight:650;color:var(--muted);font-size:.7rem;margin-bottom:3px;letter-spacing:.01em}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:.8rem;background:var(--surface);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.in-hi{background:var(--accent-soft);font-weight:750;color:var(--accent)}
.age-row{display:flex;gap:4px}.age-row input{width:64px;flex:none}
.alert{background:var(--danger-bg);border-left:4px solid var(--danger);padding:9px 11px;border-radius:0 6px 6px 0;font-size:.75rem;color:var(--danger);margin-top:10px}
.alert b{display:block;margin-bottom:2px}

/* ---------- views ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card+.card{margin-top:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:.85rem;font-weight:750}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.fbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);padding:4px 9px;border-radius:6px;font-size:.68rem;font-weight:650;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.acc-filter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:9px;font-size:.7rem;color:var(--muted)}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;max-height:620px;overflow-y:auto;padding-right:3px}
.dcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:0}
.dcard:hover{border-color:var(--accent)}
.dname{font-size:.78rem;font-weight:750}
.dind{font-size:.7rem;color:var(--muted)}
.dose{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:.72rem;font-family:var(--mono);white-space:pre-line;line-height:1.45;overflow-wrap:anywhere}
.warnline{font-size:.68rem;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:4px 7px;border-radius:5px}
.badge{display:inline-block;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:4px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.acc-sus{background:var(--sus-bg);color:var(--sus)} .acc-hosp{background:var(--hosp-bg);color:var(--hosp)}
.acc-estr{background:var(--estr-bg);color:var(--estr)} .acc-misto{background:var(--misto-bg);color:var(--misto)}
.acc-part{background:var(--part-bg);color:var(--part)}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}
.empty{color:var(--muted);text-align:center;font-size:.78rem;padding:18px;font-style:italic}

.rxitem{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:9px;margin-bottom:8px}
.rxitem-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.num{background:var(--accent);color:#fff;min-width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800}
.rxitem-h input{border:0;background:transparent;font-weight:750;padding:2px 4px;flex:1;min-width:0}
.rxitem select{width:auto;font-size:.68rem;padding:3px 6px}
.xbtn{background:none;border:0;color:var(--danger);font-weight:800;font-size:1.1rem;cursor:pointer;padding:0 4px}
.quick{display:flex;gap:4px;flex-wrap:wrap}

/* ---------- folha A4 ---------- */
.preview-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.sheet-wrap{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 110px);overflow:auto}
#printArea{background:var(--paper);color:var(--ink);max-width:210mm;min-height:270mm;margin:0 auto;padding:34px 36px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;justify-content:space-between;font-size:.83rem;line-height:1.5}
.doc-h{border-bottom:2px solid #1e1b4b;padding-bottom:10px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.doc-name{font-size:1.1rem;font-weight:800;color:#1e1b4b;text-transform:uppercase;letter-spacing:-.3px}
.doc-spec{font-size:.74rem;font-weight:700;color:#4338ca}
.doc-crm,.doc-small{font-size:.72rem;color:var(--ink-muted);font-weight:600}
.rx-badge{display:inline-block;padding:2px 8px;border:1px solid #94a3b8;border-radius:4px;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#475569}
.pt-box{background:#f8fafc;border:1px solid var(--ink-line);border-radius:6px;padding:9px 12px;margin-bottom:16px;font-size:.74rem}
.pt-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pt-sub{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid var(--ink-line);color:#475569}
.sec-route{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#475569;margin:10px 0 4px;text-decoration:underline}
.rx-it{padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid #f1f5f9}
.rx-it:last-child{border-bottom:0}
.rx-title{font-weight:750;font-size:.86rem}
.rx-inst{padding-left:11px;border-left:2px solid #a5b4fc;margin-top:3px;color:#334155;font-size:.78rem;white-space:pre-line}
.notes-box{margin-top:14px;padding-top:9px;border-top:1px solid var(--ink-line);font-size:.74rem;color:#334155;white-space:pre-line}
.notes-t{font-weight:800;text-transform:uppercase;font-size:.64rem;color:#64748b;letter-spacing:.5px;margin-bottom:3px}
.doc-f{text-align:center;padding-top:26px;margin-top:26px}
.stamp{width:230px;border-top:1px solid #0f172a;margin:0 auto 4px;padding-top:4px;font-weight:750;font-size:.74rem}

/* ---------- SUS × ideal ---------- */
.sus-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.dx-list{max-height:calc(100vh - 220px);overflow-y:auto}
.dx-group{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 4px 5px}
.dx-btn{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:7px 9px;font-size:.78rem;cursor:pointer;color:var(--fg)}
.dx-btn:hover{background:var(--surface-2)}
.dx-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.dx-btn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot-sus{background:var(--sus)} .dot-part{background:var(--part)} .dot-misto{background:var(--misto)}
.dx-title{font-size:1.15rem;font-weight:780;margin-bottom:4px}
.dx-when{font-size:.8rem;color:var(--muted);margin-bottom:12px;max-width:85ch}
.opt{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.opt-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px}
.opt-ideal .opt-h{background:var(--accent-soft)}
.opt-sus .opt-h{background:var(--sus-bg)}
.opt-alt .opt-h{background:var(--surface-2)}
.opt-h h4{margin:0;font-size:.82rem;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opt-b{padding:10px 12px;display:grid;gap:9px}
.verdict{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px}
.v-sus{background:var(--sus);color:var(--surface)} .v-part{background:var(--part);color:var(--surface)} .v-misto{background:var(--misto);color:var(--surface)}
.note{font-size:.76rem;color:var(--fg);background:var(--surface-2);border-radius:6px;padding:8px 10px;max-width:95ch}
.src{font-size:.68rem;color:var(--muted);font-weight:650}
.rx-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;border-top:1px dashed var(--line);padding-top:9px}
.rx-row:first-child{border-top:0;padding-top:0}
.rx-row .t{font-weight:750;font-size:.8rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.orient{white-space:pre-line;font-size:.78rem}

/* ---------- calculadoras ---------- */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.8rem;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
table.vt{width:100%;border-collapse:collapse;font-size:.76rem;font-variant-numeric:tabular-nums}
table.vt th,table.vt td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.vt tr.hl td{background:var(--accent-soft);font-weight:750}
.tbl-wrap{overflow-x:auto}
.refs li{margin-bottom:6px;font-size:.8rem}
.refs a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.disclaimer{font-size:.72rem;color:var(--muted);margin-top:16px;max-width:110ch}

/* ---------- sala vermelha ---------- */
.c-vermelho{background:#c62828} .c-laranja{background:#e26a00} .c-amarelo{background:#e0b400} .c-verde{background:#2e7d32} .c-azul{background:#1e5aa8}
.sv-kick{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--danger);font-weight:750;margin-bottom:2px}
.sv-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:middle}
.sv-lead{font-size:.86rem;margin:8px 0 10px;padding:9px 12px;border-left:4px solid var(--danger);background:var(--danger-bg);border-radius:0 7px 7px 0;line-height:1.5}
.sv-wnote{font-size:.74rem;color:var(--muted);margin:0 0 10px}
.sv-wnote b{color:var(--accent)}
.sv-s{margin:14px 0}
.sv-s h4{font-size:.84rem;margin:0 0 5px}
.sv-s ul{margin:0;padding-left:18px}
#view-sv li{margin:3px 0;font-size:.8rem;line-height:1.5}
.sv-rx{margin:12px 0}
.sv-rx ol{margin:0;padding:9px 14px 10px 32px}
.sv-dose{display:inline;font-family:var(--mono);font-weight:650;font-size:.76rem;color:var(--sus);background:var(--sus-bg);padding:1px 6px;border-radius:5px}
.sv-dose small{font-weight:400;opacity:.85}
.sv-tbl{border:1px solid var(--line);border-radius:8px}
.sv-tbl td{vertical-align:top}
.sv-ett{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.sv-ett div{background:var(--sus-bg);color:var(--sus);border-radius:7px;padding:5px 10px;font-family:var(--mono);font-weight:650;font-size:.78rem}
.sv-src{font-size:.72rem;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
.sv-src a{color:var(--accent)}
.sv-tools{display:flex;gap:6px;margin-bottom:6px}
.sv-tools input{flex:1}

/* ---------- prematuro ---------- */
.pm .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:10px}
.pm .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.pm .stat.main{background:var(--accent-soft);border-color:var(--accent)}
.pm .stat .l{font-size:.66rem;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pm .stat .v{font-size:1rem;font-weight:800;margin:2px 0}
.pm .stat .d{font-size:.72rem;color:var(--muted)}
.pm .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.pm .chip{font-size:.68rem;font-weight:750;padding:2px 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.pm .chip.hot{background:var(--danger-bg);color:var(--danger)} .pm .chip.ok{background:var(--sus-bg);color:var(--sus)}
.pm .box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.8rem;line-height:1.5}
.pm .box.hot{border-color:var(--danger);background:var(--danger-bg)}
.pm h2{font-size:.95rem;margin:16px 0 6px} .pm h3{font-size:.82rem;margin:10px 0 5px}
.pm .box h3{margin-top:0}
.pm p,.pm li{font-size:.8rem;line-height:1.5} .pm ul,.pm ol{padding-left:18px;margin:4px 0}
.pm .ex{font-family:var(--mono);font-size:.74rem;white-space:pre-line;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}
.pm .hint{font-size:.72rem;color:var(--muted)}
.pm .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.pm table{width:100%;border-collapse:collapse;font-size:.76rem}
.pm th,.pm td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pm th{background:var(--surface-2)}
.pm tr.now td{background:var(--accent-soft);font-weight:700} .pm tr.past td{color:var(--muted)}
.pm .kick{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:750}
.pm .warn{font-size:.72rem;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:8px 10px}
.pm a{color:var(--accent)}
details.pm-guia>summary{cursor:pointer;font-weight:750;font-size:.86rem;list-style:none}
details.pm-guia>summary::before{content:"▸ ";color:var(--accent)} details.pm-guia[open]>summary::before{content:"▾ "}

/* ---------- modelos de prontuário ---------- */
.md-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px;margin-top:10px}
.md-block{margin:0}
.md-pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:.7rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto}
.md-b{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 2px}
.md-enc .opt-h{background:var(--danger-bg)}
@media (max-width:760px){.md-grid{grid-template-columns:1fr}}

/* ---------- puericultura ---------- */
.pu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:14px}
.pu-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px}
.pu-form .sub{grid-column:1/-1;font-size:.7rem;font-weight:750;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.ig-row{display:flex;gap:6px}
.pu-wide{grid-column:1/-1}
.zpill{display:inline-block;background:var(--surface-2);color:var(--muted);font-size:.68rem;font-weight:750;padding:2px 8px;border-radius:999px;white-space:nowrap}
.z-ok{background:var(--sus-bg);color:var(--sus)} .z-warn{background:var(--warn-bg);color:var(--warn)} .z-bad{background:var(--danger-bg);color:var(--danger)}
.mb-band{margin-bottom:10px}
.mb-h{font-size:.7rem;font-weight:750;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.mb-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.78rem}
.mb-sel{display:inline-flex;gap:3px;flex-shrink:0}
.mb-b{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:.66rem;font-weight:750;padding:3px 7px;border-radius:5px;cursor:pointer;min-width:30px}
.mb-b.on.P{background:var(--sus);color:var(--surface);border-color:var(--sus)}
.mb-b.on.A{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.mb-b.on.NV{background:var(--muted);color:var(--surface);border-color:var(--muted)}
.mb-extra{display:grid;gap:6px;margin-top:10px;padding:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px}
.chk{display:flex;gap:7px;align-items:flex-start;font-weight:600;color:var(--fg);font-size:.75rem}
.chk input{width:auto;margin-top:2px}
.mb-result{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.8rem}
.mb-result .src{width:100%}
.cs-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.78rem;line-height:1.45}
.cs-t{font-weight:750;color:var(--muted);font-size:.72rem}
.cs-alert{background:var(--danger-bg);border-radius:6px;padding:8px;border:0;margin-top:6px}

@media (max-width:760px){.cs-row{grid-template-columns:1fr;gap:2px}.pu-grid{grid-template-columns:1fr}.mb-row{flex-wrap:wrap}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,12,30,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:var(--surface);width:100%;max-width:480px;border-radius:12px;padding:18px;display:grid;gap:9px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:.78rem;font-weight:650;z-index:120}
.seg{display:none;gap:4px;margin-bottom:10px}

@media (max-width:1100px){
  .split{grid-template-columns:1fr}
  .preview-col{position:static}

  .split[data-mob="editor"] .preview-col{display:none}
  .split[data-mob="preview"] .editor-col{display:none}
  .sus-layout{grid-template-columns:1fr}
  .dx-list{max-height:260px}
  .sheet-wrap{max-height:none}
}
@media (max-width:760px){
  .pt-grid{grid-template-columns:1fr 1fr}

  .pt-grid2{grid-template-columns:1fr}
  #printArea{padding:20px 16px}
  .top-actions{margin-left:0}
  .topbar{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body,html{background:#fff!important}
  .topbar,.ptbar,.editor-col,.seg,.modal,.toast,.view:not(#view-rx){display:none!important}
  .wrap{padding:0!important;max-width:none}
  .split{display:block!important}

  #printArea{box-shadow:none!important;max-width:100%!important;padding:0!important;min-height:auto}
}

<script>
// DoseCerta · Emergência adulto — núcleo: utilidades, paciente, motor de doses.
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function nf(x, d) {
  if (x === null || x === undefined || !isFinite(x)) return '—';
  if (d === undefined) { const a = Math.abs(x); d = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : a >= 0.1 ? 2 : 3; }
  return Number(x.toFixed(d)).toLocaleString('pt-BR', { maximumFractionDigits: d });
}
const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200); }
function copyText(txt, ok) {
  const fb = () => {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let r = false; try { r = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); toast(r ? (ok || 'Copiado') : 'Não foi possível copiar — selecione o texto.');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(ok || 'Copiado'), fb); else fb();
}

// ---------- paciente ----------
function P() {
  const w = parseFloat($('ptWeight').value) || 0;
  const h = parseFloat($('ptHeight').value) || 0;
  const age = parseFloat($('ptAge').value) || 0;
  const sex = $('ptSex').value === 'F' ? 'F' : 'M';
  const cr = parseFloat($('ptCr').value) || 0;
  const pp = h ? (sex === 'M' ? 50 : 45.5) + 0.91 * (h - 152.4) : 0; // peso predito (ARDSNet) = peso ideal (Devine)
  const imc = w && h ? w / Math.pow(h / 100, 2) : 0;
  const aj = pp && w > pp ? pp + 0.4 * (w - pp) : w;            // peso ajustado
  // Cockcroft-Gault: peso real; se IMC ≥ 30 usar peso ajustado
  const wcg = imc >= 30 ? aj : w;
  const clcr = cr && age && wcg ? ((140 - age) * wcg) / (72 * cr) * (sex === 'F' ? 0.85 : 1) : null;
  // CKD-EPI 2021 (sem raça)
  let egfr = null;
  if (cr && age) { const k = sex === 'F' ? 0.7 : 0.9, a = sex === 'F' ? -0.241 : -0.302; egfr = 142 * Math.pow(Math.min(cr / k, 1), a) * Math.pow(Math.max(cr / k, 1), -1.2) * Math.pow(0.9938, age) * (sex === 'F' ? 1.012 : 1); }
  return { w, h, age, sex, cr, pp: pp > 0 ? pp : 0, imc, aj, clcr, egfr, has: w > 0 };
}
function wOf(kind, p) {
  if (kind === 'obeso') return p.imc > 30 ? (p.aj || p.w) : p.w;
  if (kind === 'pp' || kind === 'ideal') return p.pp || p.w;
  if (kind === 'aj') return p.aj || p.w;
  return p.w;
}
const WLBL = { real: 'peso real', pp: 'peso predito', ideal: 'peso ideal', aj: 'peso ajustado', obeso: 'peso ajustado se IMC >30' };

// ---------- motor de dose ----------
// D(k, unidade, {max, min, c (conc./mL), wt:'real'|'ideal'|'aj', dia, div, maxd, vol, bands:[[ate_kg, dose]], round})
const D = (k, u, o = {}) => ({ t: 'd', k, u, ...o });
function doseHTML(d, p) {
  p = p || P();
  const wk = d.wt || 'real', W = p.has ? wOf(wk, p) : 0;
  const rule = [];
  if (d.bands) rule.push('dose por faixa de peso');
  else if (d.dia) rule.push(`${nf(d.k)} ${d.u}/kg/dia ÷ ${d.div}` + (d.maxd ? ` (máx. ${nf(d.maxd)} ${d.u}/dia)` : ''));
  else { rule.push(`${nf(d.k)} ${d.u}/kg`); if (d.max) rule.push(`máx. ${nf(d.max)} ${d.u}`); if (d.min) rule.push(`mín. ${nf(d.min)} ${d.u}`); }
  if (wk !== 'real' && !(wk === 'obeso' && !(p.imc > 30))) rule.push(WLBL[wk]);
  if (!W) return `<span class="sv-dose">${esc(rule.join('; '))}</span>`;
  let amt, extra = '';
  if (d.bands) amt = d.bands.find((b) => W <= b[0])[1];
  else if (d.dia) { let day = d.k * W; if (d.maxd) day = Math.min(day, d.maxd); amt = day / d.div; if (d.max) amt = Math.min(amt, d.max); extra = ` <small>(${nf(day)} ${esc(d.u)}/dia)</small>`; }
  else { amt = d.k * W; if (d.min) amt = Math.max(amt, d.min); if (d.max) amt = Math.min(amt, d.max); }
  if (d.round) amt = Math.round(amt / d.round) * d.round;
  let vol = '';
  if (d.c) vol = ` = <b>${nf(amt / d.c, d.c >= 1 && amt / d.c >= 10 ? 1 : 2)} ${d.cu || 'mL'}</b>`;
  const capped = !d.bands && !d.dia && d.max && d.k * W > d.max ? ' · dose máxima' : '';
  return `<span class="sv-dose">${nf(amt)} ${esc(d.u)}${d.dia ? '/dose' : ''}${vol}${extra}<small> [${esc(rule.join('; '))}${capped}${wk !== 'real' && W !== p.w ? ` = ${nf(W, 1)} kg` : ''}]</small></span>`;
}
function lineHTML(li, p) {
  if (typeof li === 'string') return md(li);
  if (typeof li === 'function') return lineHTML(li(p || P()), p);
  return li.map((x) => (typeof x === 'string' ? md(x) : typeof x === 'function' ? md(x(p || P())) : doseHTML(x, p))).join('');
}
// texto puro (para copiar)
function lineTXT(li, p) {
  const h = lineHTML(li, p).replace(/<small>[\s\S]*?<\/small>/g, '').replace(/<[^>]+>/g, '');
  const t = document.createElement('textarea'); t.innerHTML = h; return t.value.replace(/\s+/g, ' ').trim();
}
function tableHTML(t) {
  return `<div class="tbl-wrap sv-tbl"><table class="vt"><thead><tr>${t.head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((c) => `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const ACC_LBL = { SUS: 'SUS', HOSP: 'SUS hospitalar', MISTO: 'SUS parcial', PART: 'particular' };
const accTag = (a) => (a ? `<span class="tag-acc ta-${a}">${ACC_LBL[a] || a}</span>` : '');

// Referências — chaves usadas nos protocolos.
const REFS = {
  acls2025: ['AHA — 2025 Guidelines for CPR and ECC: Adult Advanced Life Support (out/2025)', 'https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines'],
  hcfmusp: ['Velasco IT, Hajjar LA et al. — Medicina de Emergência: abordagem prática (HC-FMUSP), padrões de diluição', ''],
  tbxsri: ['Brown CA, Walls RM — Manual of Emergency Airway Management / The Difficult Airway Course', ''],
  ardsnet: ['ARDS Network — ventilação com volume corrente baixo (NEJM 2000) e peso predito', ''],
  ssc2026: ['Surviving Sepsis Campaign — International Guidelines for Management of Sepsis and Septic Shock 2026 (Crit Care Med, mar/2026)', 'https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026'],
  ilas: ['ILAS — Instituto Latino-Americano de Sepse: protocolo gerenciado de sepse', 'https://ilas.org.br'],
  wao2020: ['World Allergy Organization — Anaphylaxis Guidance 2020', ''],
  asbai: ['ASBAI — Guia prático de anafilaxia', ''],
  atls: ['American College of Surgeons — ATLS (Advanced Trauma Life Support)', ''],
  crash2: ['CRASH-2 (Lancet 2010) — ácido tranexâmico no trauma', ''],
  accaha2025acs: ['ACC/AHA/ACEP/NAEMSP/SCAI 2025 Guideline for the Management of Acute Coronary Syndromes', ''],
  esc2023acs: ['ESC 2023 Guidelines for the management of acute coronary syndromes', ''],
  sbc_iam: ['SBC — Diretrizes de IAM com supra de ST e SCA sem supra', ''],
  stream2: ['STREAM-2 (2024) — tenecteplase em meia dose ≥60/≥75 anos', ''],
  esc2024fa: ['ESC 2024 Guidelines for the management of atrial fibrillation (CHA₂DS₂-VA)', ''],
  sbcfa: ['SBC — Diretrizes brasileiras de fibrilação atrial', ''],
  esc2023hf: ['ESC 2021 Heart Failure Guidelines + Focused Update 2023', ''],
  sbc_ic: ['SBC — Diretriz de insuficiência cardíaca crônica e aguda', ''],
  dbh2025: ['SBC/SBH/SBN — Diretriz Brasileira de Hipertensão Arterial 2025', 'https://www.medway.com.br/conteudos/metas-pressoricas-no-pronto-socorro/'],
  esc2024has: ['ESC 2024 Guidelines for elevated blood pressure and hypertension', ''],
  febrasgo_pe: ['FEBRASGO / RBEHG — pré-eclâmpsia: sulfato de magnésio e anti-hipertensivos', ''],
  esc2019tep: ['ESC 2019 Guidelines for acute pulmonary embolism', ''],
  chest2021: ['CHEST 2021 — Antithrombotic therapy for VTE disease', ''],
  aha_avc2026: ['AHA/ASA 2026 Guideline for the Early Management of Patients With Acute Ischemic Stroke', 'https://professional.heart.org/en/science-news/2026-guideline-for-the-early-management-of-patients-with-acute-ischemic-stroke/top-things-to-know'],
  sbdcv: ['SBDCV — Sociedade Brasileira de Doenças Cerebrovasculares: protocolos de AVC', ''],
  ms_avc: ['Ministério da Saúde — Linha de cuidado do AVC / PCDT trombólise', ''],
  aha_ich2022: ['AHA/ASA 2022 Guideline for Spontaneous Intracerebral Hemorrhage', ''],
  aha_hsa2023: ['AHA/ASA 2023 Guideline for Aneurysmal Subarachnoid Hemorrhage', ''],
  aes2016: ['American Epilepsy Society 2016 — Convulsive status epilepticus', ''],
  esett: ['ESETT (NEJM 2019) — levetiracetam, fosfenitoína e valproato', ''],

// Procedimentos de sala vermelha/PS — técnica resumida + gerador de descrição para o prontuário.
// campos: {id, l (rótulo), o (opções; 1ª = padrão) | t:'txt' (texto livre, d = padrão) | t:'num'}
const nowStr = () => { const d = new Date(); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} às ${String(d.getHours()).padStart(2, '0')}h${String(d.getMinutes()).padStart(2, '0')}`; };
const sn = (v, s, n) => (v === 'Sim' ? s : n || '');
const LADO = ['direita', 'esquerda'];
const INTERC = (extra = []) => ['sem intercorrências', ...extra];
const tail = (v) => `${v.interc && v.interc !== 'sem intercorrências' ? `Intercorrência: ${v.interc}.` : 'Procedimento sem intercorrências imediatas.'}${v.obs ? ' ' + v.obs : ''}`;
const TOPO = (v, nome, p) => `DESCRIÇÃO DE PROCEDIMENTO — ${nome.toUpperCase()}\nData/hora: ${v.hora}\n${$('ptName').value ? `Paciente: ${$('ptName').value}\n` : ''}`;
const CAMPO_HORA = { id: 'hora', l: 'Data/hora', t: 'txt', d: '@now' };
const CAMPO_OBS = { id: 'obs', l: 'Observações adicionais', t: 'txt', d: '' };
const CAMPO_CONS = { id: 'cons', l: 'Consentimento', o: ['obtido do paciente', 'obtido do responsável legal', 'dispensado — situação de emergência com risco à vida'] };

T({ id: 'p_iot', cat: 'Procedimentos', cor: 'azul', title: 'Intubação orotraqueal (SRI / sequência atrasada)',
  alias: ['iot', 'intubacao', 'sri', 'isr', 'descricao intubacao', 'dsi', 'sequencia atrasada', 'pre-intubacao', 'checklist'],

    { id: 'pre', l: 'Pré-tratamento', o: ['sem pré-tratamento', 'fentanil', 'cristaloide em bolus + noradrenalina já em infusão'] },
    { id: 'ind1', l: 'Indutor', o: ['etomidato', 'cetamina', 'propofol', 'midazolam', 'sem indutor'] },
    { id: 'dind', l: 'Dose do indutor (mg)', t: 'txt', d: '' },
    { id: 'bnm', l: 'Bloqueador neuromuscular', o: ['rocurônio', 'succinilcolina', 'sem bloqueador'] },

    { id: 'cl', l: 'Cormack-Lehane', o: ['I', 'IIa', 'IIb', 'III', 'IV'] },
    { id: 'bougie', l: 'Bougie', o: ['Não', 'Sim'] },
    { id: 'tubo', l: 'Tubo (mm)', o: ['7,5', '8,0', '7,0', '6,5', '8,5'] },
    { id: 'rima', l: 'Fixação na rima labial (cm)', o: ['22', '21', '23', '24', '20'] },
    { id: 'tent', l: 'Tentativas', o: ['1', '2', '3'] },

    CAMPO_OBS],
    texto: (v, p) => TOPO(v, 'Intubação orotraqueal', p) +

T({ id: 'p_dreno', cat: 'Procedimentos', cor: 'azul', title: 'Drenagem torácica (toracostomia)',
  alias: ['dreno de torax', 'drenagem toracica', 'toracostomia', 'pneumotorax', 'hemotorax', 'selo dagua', 'pigtail'],
  resumo: 'Triângulo de segurança (5º EIC, entre linhas axilares anterior e média), dissecção romba pela borda superior da costela inferior e selo d\'água.',
  secs: [ { h: 'Escolha do dreno', li: [ 'Pneumotórax espontâneo/iatrogênico estável: **pigtail 10–14 Fr** (Seldinger). Hemotórax/trauma: **24–28 Fr** (ATLS aceita 28–32; drenos menores ~14 Fr têm desempenho semelhante em estáveis). Empiema: 14–20 Fr (pigtail) com lavagem.', 'Hemotórax: drenagem inicial **≥1.500 mL** ou **>200 mL/h por 2–4 h** → toracotomia/cirurgia.' ] },
    { h: 'Técnica', li: [ 'Decúbito dorsal, braço acima da cabeça; USG para confirmar o espaço. Antissepsia, campos, **anestesia generosa** (pele, periósteo, pleura parietal — lidocaína até 4,5 mg/kg). Incisão de 2–3 cm paralela à costela, dissecção romba sobre a **borda superior da costela inferior**, abertura da pleura com pinça, exploração digital, introdução do dreno direcionado (ápice no pneumotórax, posterior-basal no hemotórax), conectar ao selo d\'água, fixar com ponto em U/bailarina.', 'Confirmar: oscilação, borbulhamento (pneumotórax), saída de líquido; **RX de tórax**.' ] },
    { h: 'Complicações', li: [ 'Mau posicionamento (subcutâneo, fissura, intra-abdominal), lesão de pulmão/vaso intercostal/fígado/baço, edema de reexpansão (drenar ≤1–1,5 L de uma vez no derrame crônico), infecção, enfisema subcutâneo.' ] } ],
  rx: [],
  proc: { campos: [CAMPO_HORA, CAMPO_CONS, { id: 'ind', l: 'Indicação', o: ['pneumotórax', 'hemotórax', 'hemopneumotórax traumático', 'derrame pleural volumoso/empiema', 'pneumotórax hipertensivo após descompressão por agulha'] },
    { id: 'lado', l: 'Hemitórax', o: LADO }, { id: 'eic', l: 'Local', o: ['5º espaço intercostal entre as linhas axilares anterior e média', '4º espaço intercostal na linha axilar média', '2º espaço intercostal na linha hemiclavicular (pigtail)'] },
    { id: 'usg', l: 'USG prévio', o: ['Sim', 'Não'] }, { id: 'tec', l: 'Técnica', o: ['dissecção romba (cirúrgica)', 'Seldinger (pigtail)'] },
    { id: 'dreno', l: 'Dreno', o: ['tubular 28 Fr', 'tubular 24 Fr', 'tubular 32 Fr', 'pigtail 14 Fr', 'pigtail 10 Fr'] },
    { id: 'saida', l: 'Saída imediata', o: ['saída de ar em grande quantidade', 'saída de ar e ___ mL de sangue', 'saída de ___ mL de sangue', 'saída de ___ mL de líquido seroso/citrino', 'saída de ___ mL de secreção purulenta'] },
    { id: 'interc', l: 'Intercorrências', o: INTERC(['sangramento de parede controlado com compressão', 'enfisema subcutâneo']) }, CAMPO_OBS],
    texto: (v, p) => TOPO(v, 'Drenagem torácica', p) + `Indicação: ${v.ind} à ${v.lado}. Consentimento: ${v.cons}.\nPaciente em decúbito dorsal com membro superior ${v.lado} abduzido.${v.usg === 'Sim' ? ' Local confirmado ao ultrassom.' : ''} Antissepsia com clorexidina, campos estéreis e anestesia local com lidocaína 2% por planos (pele, subcutâneo, periósteo e pleura parietal). ${v.tec === 'Seldinger (pigtail)' ? `Punção no ${v.eic} com aspiração de ar/líquido, passagem de fio-guia, dilatação e inserção de dreno ${v.dreno} pela técnica de Seldinger.` : `Incisão de 2–3 cm no ${v.eic}, dissecção romba pela borda superior da costela inferior, abertura da pleura parietal, exploração digital da cavidade (sem aderências/órgãos) e introdução de dreno ${v.dreno}.`}\nConectado a sistema fechado em selo d'água, com ${v.saida}, oscilação presente. Fixação com ponto em U e bailarina; curativo oclusivo. RX de tórax de controle solicitado.\n` + tail(v) },
  fontes: ['atls', 'bts2023'] });

T({ id: 'p_agulha', cat: 'Procedimentos', cor: 'azul', title: 'Descompressão torácica por agulha',
  alias: ['toracocentese de alivio', 'descompressao', 'pneumotorax hipertensivo', 'agulha'],

  secs: [ { h: 'Técnica', li: [ 'Adulto: **4º–5º EIC na linha axilar média** (ATLS — parede mais fina) ou 2º EIC na linha hemiclavicular. Cateter **14G de 8 cm** sobre a borda superior da costela, até saída de ar; manter o cateter e preparar **drenagem torácica**.', 'Alternativa: toracostomia digital (simples) no paciente em VM.' ] } ],
  rx: [],
  proc: { campos: [CAMPO_HORA, { id: 'lado', l: 'Hemitórax', o: LADO }, { id: 'loc', l: 'Local', o: ['4º–5º espaço intercostal na linha axilar média', '2º espaço intercostal na linha hemiclavicular'] }, { id: 'cat', l: 'Cateter', o: ['14G 8 cm', '14G 5 cm', '16G'] },
    { id: 'res', l: 'Resultado', o: ['saída de ar sob pressão com melhora hemodinâmica e da saturação', 'saída de ar sem melhora clínica — reavaliar diagnóstico'] }, { id: 'interc', l: 'Intercorrências', o: INTERC() }, CAMPO_OBS],
    texto: (v, p) => TOPO(v, 'Descompressão torácica por agulha', p) + `Indicação: suspeita clínica de pneumotórax hipertensivo à ${v.lado} (instabilidade hemodinâmica, murmúrio vesicular abolido, hipertimpanismo).\nAntissepsia local. Punção com cateter ${v.cat} no ${v.loc} ${v.lado === 'direita' ? 'direito' : 'esquerdo'}, sobre a borda superior da costela inferior, com ${v.res}. Cateter mantido e fixado; programada drenagem torácica em selo d'água.\n` + tail(v) },

T({ id: 'p_toraco', cat: 'Procedimentos', cor: 'azul', title: 'Toracocentese',

T({ id: 'p_parac', cat: 'Procedimentos', cor: 'azul', title: 'Paracentese',
  alias: ['paracentese', 'ascite', 'pbe', 'puncao abdominal', 'albumina'],
  resumo: 'Diagnóstica em toda ascite nova ou cirrótico internado/descompensado (PBE: PMN ≥250/mm³). De alívio: albumina 6–8 g por litro retirado se >5 L.',
  secs: [ { h: 'Técnica', li: [ 'Local: **fossa ilíaca esquerda**, 2/3 da linha umbigo–espinha ilíaca anterossuperior (lateral aos vasos epigástricos), confirmado ao USG. Técnica em Z para reduzir vazamento.', 'Coagulopatia da cirrose **não** contraindica (exceto CIVD/fibrinólise clinicamente evidente).', 'Exames: celularidade com diferencial, albumina (GASA = albumina sérica − ascítica; ≥1,1 = hipertensão portal), proteína total, cultura em frasco de hemocultura à beira-leito, Gram; glicose/DHL/amilase/citologia conforme suspeita.' ] } ],
  rx: [ { h: 'Albumina após paracentese de alívio', li: [ 'Retirada >5 L: **albumina 20% 6–8 g por litro retirado** (ex.: 8 L → 48–64 g = 240–320 mL de albumina 20%).', 'PBE: ceftriaxona 2 g/dia + albumina 1,5 g/kg no D1 e 1 g/kg no D3.' ] } ],
  proc: { campos: [CAMPO_HORA, CAMPO_CONS, { id: 'fin', l: 'Finalidade', o: ['diagnóstica e de alívio', 'diagnóstica', 'de alívio'] }, { id: 'loc', l: 'Local', o: ['fossa ilíaca esquerda', 'fossa ilíaca direita', 'infraumbilical na linha média'] },
    { id: 'usg', l: 'Guiada por USG', o: ['Sim', 'Não'] }, { id: 'vol', l: 'Volume (mL)', t: 'txt', d: '' }, { id: 'asp', l: 'Aspecto', o: ['citrino', 'turvo', 'hemático', 'leitoso', 'purulento'] },
    { id: 'alb', l: 'Albumina reposta', t: 'txt', d: '' }, { id: 'interc', l: 'Intercorrências', o: INTERC(['vazamento de líquido pelo orifício, curativo compressivo']) }, CAMPO_OBS],
    texto: (v, p) => TOPO(v, 'Paracentese', p) + `Finalidade: ${v.fin}. Consentimento: ${v.cons}.\nPaciente em decúbito dorsal. ${v.usg === 'Sim' ? 'Ponto demarcado ao ultrassom, sem alças interpostas. ' : ''}Antissepsia com clorexidina, campos estéreis e anestesia local com lidocaína 2%. Punção em ${v.loc} com técnica em Z, obtendo-se líquido de aspecto ${v.asp}. Drenados ${v.vol || '___'} mL. Coletado material para celularidade com diferencial, albumina, proteínas totais, Gram e cultura (frascos de hemocultura à beira-leito).${v.alb ? ` Reposição de albumina: ${v.alb}.` : ''} Curativo oclusivo.\n` + tail(v) },

T({ id: 'p_pl', cat: 'Procedimentos', cor: 'azul', title: 'Punção lombar',
  alias: ['puncao lombar', 'liquor', 'lcr', 'meningite', 'raquicentese', 'pressao de abertura'],
  resumo: 'Suspeita de meningite/encefalite, HSA com TC normal, pressão de abertura (HIC idiopática). TC antes se déficit focal, papiledema, rebaixamento, imunossupressão, convulsão recente ou >60 anos.',
  secs: [ { h: 'Técnica', li: [ 'Decúbito lateral (para medir pressão de abertura) ou sentado; espaço **L3–L4 ou L4–L5** (linha entre as cristas ilíacas = L4). Agulha 20–22G (preferir atraumática), bisel paralelo às fibras longitudinais.', 'Pressão de abertura normal: 6–25 cmH₂O (decúbito lateral, pernas estendidas). Colher 4 tubos (1: bioquímica; 2: Gram/cultura; 3: celularidade; 4: extras — PCR viral, VDRL, criptococo, citologia).', 'Meningite bacteriana suspeita: **não atrasar ceftriaxona + dexametasona** pela TC/PL.', 'Anticoagulação/plaquetas <50 mil: corrigir antes quando possível.' ] } ],
  rx: [],
  proc: { campos: [CAMPO_HORA, CAMPO_CONS, { id: 'ind', l: 'Indicação', o: ['suspeita de meningite/meningoencefalite', 'suspeita de hemorragia subaracnóidea com TC sem alterações', 'medida de pressão de abertura', 'investigação de doença neurológica'] },
    { id: 'tc', l: 'TC prévia', o: ['TC de crânio sem contraindicações à punção', 'TC dispensada (sem critérios clínicos de risco)'] },
    { id: 'pos', l: 'Posição', o: ['decúbito lateral esquerdo', 'decúbito lateral direito', 'sentado'] }, { id: 'esp', l: 'Espaço', o: ['L3–L4', 'L4–L5', 'L2–L3'] },
    { id: 'ag', l: 'Agulha', o: ['22G Quincke', '20G Quincke', '22G atraumática (Sprotte/Whitacre)'] }, { id: 'tent', l: 'Tentativas', o: ['1', '2', '3'] },
    { id: 'pa', l: 'Pressão de abertura (cmH₂O)', t: 'txt', d: '' }, { id: 'asp', l: 'Aspecto do líquor', o: ['límpido e incolor ("água de rocha")', 'turvo', 'xantocrômico', 'hemorrágico com clareamento nos tubos sequenciais (acidente de punção)', 'hemorrágico sem clareamento'] },
    { id: 'vol', l: 'Volume coletado (mL)', t: 'txt', d: '10' }, { id: 'interc', l: 'Intercorrências', o: INTERC(['acidente de punção', 'parestesia transitória em membro inferior durante a punção']) }, CAMPO_OBS],
    texto: (v, p) => TOPO(v, 'Punção lombar', p) + `Indicação: ${v.ind}. ${v.tc}. Consentimento: ${v.cons}.\nPaciente em ${v.pos}, com flexão de quadril e cervical. Antissepsia com clorexidina, campos estéreis, anestesia local com lidocaína 2%. Punção no espaço ${v.esp} com agulha ${v.ag}, em ${v.tent} tentativa(s), obtendo-se líquor de aspecto ${v.asp}${v.pa ? `, pressão de abertura de ${v.pa} cmH₂O` : ''}. Coletados ${v.vol} mL em 4 tubos (bioquímica, Gram/cultura, celularidade e reserva). Retirada a agulha com mandril recolocado; curativo.\n` + tail(v) },
  fontes: ['idsa_men'] });

T({ id: 'p_peric', cat: 'Procedimentos', cor: 'azul', title: 'Pericardiocentese',
  alias: ['pericardiocentese', 'tamponamento', 'derrame pericardico'],
  resumo: 'Tamponamento com instabilidade (hipotensão, turgência jugular, abafamento de bulhas, colapso de VD ao POCUS). No trauma: preferir toracotomia/janela pericárdica — pericardiocentese só como ponte.',

  rx: [],
  proc: { campos: [CAMPO_HORA, CAMPO_CONS, { id: 'jan', l: 'Acesso', o: ['subxifoide', 'paraesternal esquerdo', 'apical'] }, { id: 'usg', l: 'Guiada por USG', o: ['Sim', 'Não (emergência)'] },
    { id: 'vol', l: 'Volume aspirado (mL)', t: 'txt', d: '' }, { id: 'asp', l: 'Aspecto', o: ['sero-hemático', 'hemático que não coagula', 'citrino', 'purulento'] }, { id: 'pig', l: 'Pigtail deixado', o: ['Sim', 'Não'] },
    { id: 'res', l: 'Resposta', o: ['melhora da PA e da FC após a aspiração', 'sem melhora hemodinâmica'] }, { id: 'interc', l: 'Intercorrências', o: INTERC(['extrassístoles ventriculares durante a punção']) }, CAMPO_OBS],
    texto: (v, p) => TOPO(v, 'Pericardiocentese', p) + `Indicação: tamponamento cardíaco com instabilidade hemodinâmica. Consentimento: ${v.cons}.\nMonitorização cardíaca contínua. ${v.usg === 'Sim' ? 'Ecocardiografia à beira-leito com derrame pericárdico volumoso e sinais de tamponamento; definida janela ' + v.jan + '.' : 'Acesso ' + v.jan + ' por reparos anatômicos.'} Antissepsia, campos estéreis, anestesia local. Punção com agulha 18G ${v.usg === 'Sim' ? 'sob visão ultrassonográfica' : 'direcionada ao ombro esquerdo'}, com aspiração de ${v.vol || '___'} mL de líquido ${v.asp}${v.pig === 'Sim' ? '; passagem de fio-guia e cateter pigtail para drenagem contínua' : ''}. Evoluiu com ${v.res}.\n` + tail(v) },
  fontes: ['esc2015peric'] });

T({ id: 'p_cve', cat: 'Procedimentos', cor: 'azul', title: 'Cardioversão elétrica / desfibrilação',
  alias: ['cardioversao', 'cve', 'desfibrilacao', 'choque sincronizado', 'fa', 'flutter', 'tsv', 'tv'],
  resumo: 'Sincronizada para taquiarritmias com pulso instáveis (ou eletivas); não sincronizada (desfibrilação) para FV/TV sem pulso e TV polimórfica.',

  rx: [],
  proc: { campos: [CAMPO_HORA, CAMPO_CONS, { id: 'ritmo', l: 'Ritmo', o: ['fibrilação atrial com resposta ventricular elevada', 'flutter atrial', 'taquicardia supraventricular', 'taquicardia ventricular monomórfica com pulso'] },
    { id: 'inst', l: 'Indicação', o: ['instabilidade hemodinâmica (hipotensão/má perfusão)', 'dor torácica isquêmica', 'insuficiência cardíaca aguda', 'rebaixamento do nível de consciência', 'cardioversão eletiva'] },
    { id: 'sed', l: 'Sedação', t: 'txt', d: '@sed' }, { id: 'pas', l: 'Posição das pás', o: ['anteroposterior', 'anterolateral'] },
    { id: 'en', l: 'Choques (energias)', t: 'txt', d: '200 J' }, { id: 'res', l: 'Resultado', o: ['reversão para ritmo sinusal', 'controle da frequência sem reversão do ritmo', 'sem resposta'] },
    { id: 'interc', l: 'Intercorrências', o: INTERC(['hipotensão transitória pós-sedação', 'bradicardia transitória pós-choque']) }, CAMPO_OBS],
    texto: (v, p) => TOPO(v, 'Cardioversão elétrica sincronizada', p) + `Ritmo: ${v.ritmo}. Indicação: ${v.inst}. Consentimento: ${v.cons}.\nMonitorização multiparamétrica, acesso venoso, material de via aérea e aspiração disponíveis, O₂ suplementar. Sedação com ${v.sed}. Pás em posição ${v.pas}, modo sincronizado confirmado (marcação sobre o QRS). Realizado(s) choque(s) bifásico(s) sincronizado(s): ${v.en}. Resultado: ${v.res}. ECG de 12 derivações após o procedimento.\n` + tail(v),
    calc: (p) => ({ sed: p.w ? `fentanil ${nf(Math.min(p.w, 100), 0)} mcg IV + etomidato ${nf(0.15 * p.w, 0)} mg IV` : 'fentanil 50 mcg IV + etomidato 0,15 mg/kg IV' }) },
  fontes: ['acls2025'] });

const PF_ST = {};
function procValues(t) {
  const p = P(); const st = PF_ST[t.id] || (PF_ST[t.id] = {});
  const base = t.proc.calc ? t.proc.calc(p) : {};
  const v = {};
  t.proc.campos.forEach((c) => {
    let def = c.o ? c.o[0] : c.d ?? '';
    if (def === '@now') def = nowStr();
    else if (typeof def === 'string' && def.startsWith('@')) def = base[def.slice(1)] ?? '';
    v[c.id] = st[c.id] ?? def;
  });
  if (t.proc.dyn) { const d = t.proc.dyn(v, p); Object.keys(d).forEach((k) => { if (st[k] === undefined) v[k] = d[k]; }); }
  return v;
}
function procFormHTML(t) {
  const v = procValues(t);
  const f = t.proc.campos.map((c) => {
    const id = `pf_${c.id}`;
    if (c.o) return `<div><label for="${id}">${esc(c.l)}</label><select id="${id}" data-pf="${c.id}">${c.o.map((o) => `<option ${o === v[c.id] ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    return `<div${c.id === 'obs' || c.id === 'vm' || c.id === 'causa' ? ' style="grid-column:1/-1"' : ''}><label for="${id}">${esc(c.l)}</label><input id="${id}" data-pf="${c.id}" value="${esc(v[c.id])}"></div>`;
  }).join('');
  return `<div class="opt sv-rx"><div class="opt-h"><h4>Descrição para o prontuário</h4><span><button class="btn btn-line btn-sm" type="button" id="pfReset">Limpar</button> <button class="btn btn-primary btn-sm" type="button" id="pfCopy">Copiar descrição</button></span></div>
    <div class="opt-b"><div class="inf-row" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${f}</div>
    <pre class="pre-out" id="pfOut">${esc(t.proc.texto(v, P()))}</pre><p class="src">Edite os campos ou o texto copiado; substitua os "___" pelos dados reais. Descreva apenas o que foi efetivamente realizado.</p></div></div>`;
}

const UNIT_FACTOR = {
  // retorna (dose, peso) → quantidade na unidade-base por hora
  'mcg/kg/min': (d, w) => d * w * 60 / 1000, 'mcg/min': (d) => d * 60 / 1000, 'mcg/kg/h': (d, w) => d * w / 1000, 'mcg/h': (d) => d / 1000,
  'mg/kg/h': (d, w) => d * w, 'mg/h': (d) => d, 'mg/min': (d) => d * 60, 'g/h': (d) => d * 1000,
  'U/min': (d) => d * 60, 'U/kg/h': (d, w) => d * w, 'U/h': (d) => d
};
const needsW = (u) => /\/kg\//.test(u);
const INF_ST = { id: 'nora', unit: {}, dil: {}, wsel: null };

function infConc(f) { const o = INF_ST.dil[f.id] || {}; const n = o.n ?? f.n, dil = o.dil ?? f.dil; const vol = n * f.vamp + dil; return { n, dil, vol, total: n * f.amp, conc: (n * f.amp) / vol }; }
function infW(f) { const p = P(); const k = INF_ST.wsel || f.wDefault || 'real'; return { w: wOf(k, p), k, p }; }
function concTxt(f, c) {
  if (f.base === 'U') return `${nf(c.conc, c.conc < 1 ? 2 : 1)} UI/mL`;
  return c.conc < 1 ? `${nf(c.conc * 1000, 1)} mcg/mL` : `${nf(c.conc, 2)} mg/mL`;
}
function mlh(f, unit, dose, w) { const c = infConc(f); return UNIT_FACTOR[unit](dose, w) / c.conc; }
function doseFromMlh(f, unit, rate, w) { const c = infConc(f); return rate * c.conc / UNIT_FACTOR[unit](1, w); }

function infOut(from) {

  else { const r = parseFloat($('infRate').value) || 0; const d = doseFromMlh(f, unit, r, w); $('infDose').value = +d.toPrecision(3); INF_ST.lastDose = { id: f.id, unit, v: d }; }
  const d = parseFloat($('infDose').value) || 0, r = parseFloat($('infRate').value) || 0;
  const fx = f.faixa[unit];
  const alert = d > fx[3] ? `<div class="warnline" style="margin-top:6px">Acima do máximo habitual (${nf(fx[3], 3)} ${unit}).</div>` : '';
  $('infOut').innerHTML = `<div class="big-out">${nf(r, 1)} mL/h</div><div class="src">${nf(d, 3)} ${unit}${needsW(unit) ? ` · ${nf(w, 1)} kg` : ''} · ${f.base === 'U' ? nf(UNIT_FACTOR[unit](d, w), 2) + ' UI/h' : nf(UNIT_FACTOR[unit](d, w), 2) + ' mg/h'} · 1 frasco dura ~${r > 0 ? nf(infConc(f).vol / r, 1) : '—'} h</div>${alert}`;
}
function infRx() {

}

    const ph = cv('gPh'), pco2 = cv('gPco2'), hco3 = cv('gHco3'), na = cv('gNa'), cl = cv('gCl'), alb = cv('gAlb'), lac = cv('gLac'), po2 = cv('gPo2'), fio2 = cv('gFio2');
    if (isFinite(ph) && isFinite(pco2) && isFinite(hco3)) {
      const hEst = 24 * pco2 / hco3, phEst = 9 - Math.log10(hEst); // consistência (Henderson)
      const incons = Math.abs(phEst - ph) > 0.05;
      let prim = [], comp = [];
      if (ph < 7.35) {
        if (hco3 < 22) { prim.push('Acidose metabólica'); const e = 1.5 * hco3 + 8; comp.push(`pCO₂ esperada (Winter) = 1,5 × ${nf(hco3, 1)} + 8 = **${nf(e - 2, 0)}–${nf(e + 2, 0)} mmHg** → ${pco2 > e + 2 ? '**acidose respiratória associada**' : pco2 < e - 2 ? '**alcalose respiratória associada**' : 'compensação adequada'}`); }
        if (pco2 > 45) { prim.push('Acidose respiratória'); const ag = 24 + (pco2 - 40) / 10, cr = 24 + 3.5 * (pco2 - 40) / 10; comp.push(`HCO₃ esperado: aguda ≈ **${nf(ag, 1)}**, crônica ≈ **${nf(cr, 1)}** mEq/L${hco3 < ag - 2 ? ' → **acidose metabólica associada**' : hco3 > cr + 2 ? ' → **alcalose metabólica associada**' : ''}`); }
      } else if (ph > 7.45) {
        if (hco3 > 26) { prim.push('Alcalose metabólica'); const e = 0.7 * hco3 + 21; comp.push(`pCO₂ esperada = 0,7 × ${nf(hco3, 1)} + 21 = **${nf(e - 2, 0)}–${nf(e + 2, 0)} mmHg** → ${pco2 > e + 2 ? '**acidose respiratória associada**' : pco2 < e - 2 ? '**alcalose respiratória associada**' : 'compensação adequada'}`); }
        if (pco2 < 35) { prim.push('Alcalose respiratória'); const ag = 24 - 2 * (40 - pco2) / 10, cr = 24 - 5 * (40 - pco2) / 10; comp.push(`HCO₃ esperado: aguda ≈ **${nf(ag, 1)}**, crônica ≈ **${nf(cr, 1)}** mEq/L${hco3 > ag + 2 ? ' → **alcalose metabólica associada**' : hco3 < cr - 2 ? ' → **acidose metabólica associada**' : ''}`); }
      } else {
        if (hco3 < 22 && pco2 < 35) prim.push('pH normal com HCO₃ e pCO₂ baixos → distúrbio misto (acidose metabólica + alcalose respiratória)');
        else if (hco3 > 26 && pco2 > 45) prim.push('pH normal com HCO₃ e pCO₂ altos → distúrbio misto (alcalose metabólica + acidose respiratória)');
        else prim.push('pH normal');
      }
      h += box(prim.some((x) => /cidose/.test(x)) && ph < 7.2 ? 'bad' : '', `<b>${prim.join(' + ') || '—'}</b>${comp.length ? '<ul style="margin:6px 0 0;padding-left:18px">' + comp.map((c) => `<li>${md(c)}</li>`).join('') + '</ul>' : ''}${incons ? `<div class="warnline" style="margin-top:6px">pH, pCO₂ e HCO₃ inconsistentes (pH calculado ${nf(phEst, 2)}) — conferir a amostra.</div>` : ''}`);
      if (isFinite(na) && isFinite(cl)) {
        const agv = na - (cl + hco3), agc = isFinite(alb) ? agv + 2.5 * (4 - alb) : agv;
        const dr = (agc - 12) / (24 - hco3);
        let dtxt = '';
        if (hco3 < 24 && agc > 12) dtxt = dr < 0.4 ? 'acidose hiperclorêmica (AG normal) predominante' : dr < 0.8 ? 'acidose com AG aumentado + hiperclorêmica associada' : dr <= 2 ? 'acidose com AG aumentado pura' : 'AG aumentado + **alcalose metabólica** (ou acidose respiratória crônica) associada';
        h += box(agc > 12 ? 'warnb' : 'ok', `Ânion gap = ${nf(na, 0)} − (${nf(cl, 0)} + ${nf(hco3, 1)}) = <b>${nf(agv, 1)}</b>${isFinite(alb) ? ` · corrigido pela albumina = <b>${nf(agc, 1)}</b>` : ''} (normal 8–12)
          ${hco3 < 24 && agc > 12 ? `<br>Delta-delta (ΔAG/ΔHCO₃) = (${nf(agc, 1)} − 12) / (24 − ${nf(hco3, 1)}) = <b>${nf(dr, 2)}</b> → ${dtxt}` : ''}
          ${agc > 12 ? '<br><span class="src">AG ↑: <b>MUDPILES/GOLDMARK</b> — cetoacidose (diabética, alcoólica, jejum), lactato, uremia, metanol/etilenoglicol, salicilato, paracetamol (5-oxoprolina), ferro/isoniazida.</span>' : hco3 < 22 ? '<br><span class="src">AG normal: diarreia, fístulas, ATR, acetazolamida, SF em excesso (hiperclorêmica), ureterossigmoidostomia.</span>' : ''}`);
      }
      if (isFinite(lac)) h += box(lac >= 4 ? 'bad' : lac > 2 ? 'warnb' : 'ok', `Lactato <b>${nf(lac, 1)} mmol/L</b> ${lac >= 4 ? '— hipoperfusão grave (choque séptico se vasopressor)' : lac > 2 ? '— elevado: repetir em 2–4 h' : '— normal'}`);
      if (isFinite(po2) && isFinite(fio2) && fio2 > 0) {
        const pf = po2 / (fio2 / 100), paa = (fio2 / 100) * 713 - pco2 / 0.8 - po2, aaN = (p.age || 40) / 4 + 4;
        h += box(pf < 200 ? 'bad' : pf < 300 ? 'warnb' : 'ok', `P/F = <b>${nf(pf, 0)}</b> ${pf < 100 ? '(SDRA grave se critérios)' : pf < 200 ? '(moderada)' : pf < 300 ? '(leve)' : ''} · Gradiente A–a = <b>${nf(paa, 0)} mmHg</b> (esperado ≤${nf(aaN, 0)} para a idade)`);
      }
    } else h += `<p class="src">Preencha pH, pCO₂ e HCO₃.</p>`;
  }
  if (id === 'sodio') {
    const na = cv('nNa'), gli = cv('nGli'), alvo = cv('nAlvo'), sv = ($('nSol') || {}).value || '513', kadd = cv('nKadd') || 0, risco = ($('nRisco') || {}).value === '1';
    const [solNa, solK] = sv.split('|').map(Number); const infK = (solK || 0) + kadd;
    const f = p.sex === 'F' ? (p.age >= 65 ? 0.45 : 0.5) : (p.age >= 65 ? 0.5 : 0.6);
    const act = p.w * f;

      let hh = '';
      if (isFinite(gli) && gli > 100) hh += `Na corrigido pela glicemia: <b>${nf(na + 1.6 * (gli - 100) / 100, 1)}</b> (Katz, 1,6) a <b>${nf(na + 2.4 * (gli - 100) / 100, 1)}</b> (Hillier, 2,4) mEq/L.<br>`;
      hh += `ACT = ${nf(p.w, 1)} kg × ${nf(f, 2)} = <b>${nf(act, 1)} L</b>.`;

      const dpl = (solNa + infK - na) / (act + 1);
      const lim = risco ? 8 : 10;
      h += box('', `<b>Adrogué-Madias:</b> 1 L da solução muda o Na em <b>${dpl >= 0 ? '+' : ''}${nf(dpl, 2)} mEq/L</b> = (${solNa}${infK ? ' + ' + infK : ''} − ${nf(na, 0)}) / (${nf(act, 1)} + 1).<br><span class="src">Não considera perdas urinárias/insensíveis — dosar Na a cada 2–4 h.</span>`);
      if (na < 135) {
        const target = isFinite(alvo) ? alvo : na + Math.min(lim, 8);
        const d = target - na;
        if (dpl > 0) {
          const L = d / dpl;
          h += box(d > lim ? 'bad' : 'ok', `Para subir <b>${nf(d, 1)} mEq/L</b> (até ${nf(target, 0)}): <b>${nf(L * 1000, 0)} mL</b> da solução em 24 h ≈ <b>${nf(L * 1000 / 24, 1)} mL/h</b>.<br>Limite de correção: <b>${lim} mEq/L em 24 h</b>${risco ? ' (alto risco de desmielinização)' : ' (8 se alto risco)'}${d > lim ? ' — <b>alvo acima do limite!</b>' : ''}.`);
        }
        h += box('warnb', `<b>Sintomas graves</b> (convulsão, coma, vômitos, desconforto respiratório): <b>NaCl 3% 150 mL em 20 min</b> (ou 2 mL/kg = ${nf(2 * p.w, 0)} mL), repetir até 2–3× até +5 mEq/L.<br>Preparo NaCl 3% 500 mL: SF 0,9% 445 mL + NaCl 20% 55 mL.<br>Hipercorreção: SG 5% ${nf(3 * p.w, 0)} mL/h (3 mL/kg/h) ± desmopressina 2 mcg IV.`);
      } else if (na > 145) {
        const deficit = act * (na / 140 - 1);
        h += box('', `Déficit de água livre = ACT × (Na/140 − 1) = <b>${nf(deficit, 1)} L</b>.<br>Crônica (>48 h): reduzir ≤10–12 mEq/L em 24 h (~0,5 mEq/L/h)${isFinite(alvo) ? '' : ' — informe o alvo para calcular o volume da solução escolhida'}.`);
        if (isFinite(alvo) && dpl < 0) { const L = (alvo - na) / dpl; h += box(na - alvo > 12 ? 'bad' : 'ok', `Para baixar até <b>${nf(alvo, 0)}</b>: <b>${nf(L * 1000, 0)} mL</b> em 24 h ≈ <b>${nf(L * 1000 / 24, 1)} mL/h</b> + repor perdas insensíveis (~800–1.000 mL/dia) e urinárias.${na - alvo > 12 ? ' <b>Queda acima do recomendado.</b>' : ''}`); }
      }
    } else h += `<p class="src">Informe o Na e o peso.</p>`;
  }
  if (id === 'potassio') {
    const k = cv('kK'), mg = cv('kMg'), via = ($('kVia') || {}).value || 'p';
    if (isFinite(k)) {
      if (k >= 5.5) h += box('bad', `Hipercalemia — ver protocolo <b>Hipercalemia</b> na Sala Vermelha (ECG imediato).`);
      else if (k < 3.5) {
        const grave = k < 2.5, mod = k < 3;
        const def = (3.5 - k) * 100; // ~100 mEq por 0,3? usar faixa
        h += box(grave ? 'bad' : mod ? 'warnb' : '', `<b>Hipocalemia ${grave ? 'grave' : mod ? 'moderada' : 'leve'}</b> (K ${nf(k, 1)}). Déficit corporal estimado: ~<b>${nf((3.5 - k) * 200, 0)}–${nf((3.5 - k) * 400, 0)} mEq</b> (≈200–400 mEq para cada 1 mEq/L abaixo de 3,5) — repor em etapas com dosagens.`);
        const ivTxt = via === 'c'
          ? `<b>Central:</b> SF 0,9% 100 mL + KCl 19,1% 8 mL (20 mEq) em 1 h (até 20 mEq/h; 40 mEq/h só se ameaça à vida, com monitor).`
          : `<b>Periférico:</b> SF 0,9% 500 mL + KCl 19,1% 8 mL (20 mEq = 40 mEq/L) a 125–250 mL/h (≤10 mEq/h). Concentração máx. periférica ~60 mEq/L.`;
        h += box('', `${mod || grave ? `<b>IV</b> (K &lt;3 ou sintomas/arritmia/ECG): ${ivTxt}<br>` : ''}<b>VO:</b> ${mod || grave ? 'associar' : ''} KCl xarope 6% (15 mL = 12 mEq) ou cápsula 600 mg (8 mEq): ${mod || grave ? '40 mEq 3–4×/dia' : '10–20 mEq 2–4×/dia (20–80 mEq/dia)'}.<br><span class="src">Apresentações: KCl 19,1% 10 mL = 25 mEq (2,5 mEq/mL); KCl 10% 10 mL = 13,4 mEq. Nunca IV em bolus. Dosar K a cada 4–6 h na reposição IV.</span>`);
        if (!isFinite(mg) || mg < 2) h += box('warnb', `Corrigir <b>magnésio</b> junto (hipomagnesemia impede a correção do K): sulfato de magnésio 2 g IV em 1–2 h.`);
      } else h += box('ok', 'Potássio normal.');
    }
  }
  if (id === 'camgp') {
    const ca = cv('cCa'), alb = cv('cAlb'), cai = cv('cCai'), mg = cv('cMg'), ph = cv('cP');
    if (isFinite(ca)) {
      const cc = isFinite(alb) ? ca + 0.8 * (4 - alb) : ca;
      h += box(cc < 7.5 || cc > 13 ? 'bad' : cc < 8.5 || cc > 10.5 ? 'warnb' : 'ok', `Ca corrigido = ${nf(ca, 1)} + 0,8 × (4 − ${isFinite(alb) ? nf(alb, 1) : '4'}) = <b>${nf(cc, 1)} mg/dL</b> (prefira o Ca iônico, normal 1,12–1,32 mmol/L).`);
      if (cc < 7.5 || (isFinite(cai) && cai < 0.9)) h += box('', `<b>Hipocalcemia grave/sintomática:</b> gluconato de cálcio 10% <b>10–20 mL (1–2 g)</b> em 50–100 mL SG 5% em 10–20 min; depois infusão <b>0,5–1,5 mg/kg/h de Ca elementar</b> = ${nf(0.5 * p.w, 0)}–${nf(1.5 * p.w, 0)} mL/h da solução <b>gluconato 10% 110 mL + SG 5% 890 mL</b> (1 mg/mL). Corrigir Mg antes.`);
      if (cc > 12) h += box('', `<b>Hipercalcemia ${cc >= 14 ? 'grave' : 'moderada'}:</b> SF 0,9% 200–300 mL/h (diurese 100–150 mL/h); <b>ácido zoledrônico 4 mg IV em 15 min</b> (ou pamidronato 60–90 mg em 2–4 h); calcitonina 4 UI/kg SC/IM 12/12h por 48 h (efeito rápido); furosemida só após volemia; corticoide se linfoma/granulomatose; diálise se refratária/IR.`);
    }
    if (isFinite(mg)) {
      if (mg < 1.2) h += box('bad', `<b>Hipomagnesemia grave</b> (Mg ${nf(mg, 1)}): sulfato de magnésio <b>2 g IV em 15 min</b> se arritmia/torsades/convulsão; depois 4–8 g em 12–24 h (ex.: 4 g em 250 mL em 4 h). Ampola 50%: 1 mL = 500 mg = 4 mEq. Cuidado na insuficiência renal.`);
      else if (mg < 1.8) h += box('warnb', `Hipomagnesemia leve/moderada: sulfato de magnésio 1–2 g IV em 1–2 h, ou VO (óxido/cloreto de Mg) se assintomático.`);

      else if (ph < 2.5) h += box('warnb', `Hipofosfatemia: reposição VO (fosfato 250–500 mg 3×/dia) se assintomático; IV se <1–1,5, sintomático ou em ventilação/realimentação.`);

  if (id === 'bic') {
    const hc = cv('bHco3'), al = cv('bAlvo'), ph = cv('bPh');
    if (isFinite(hc) && p.w) {
      const alvo = isFinite(al) ? al : 15, def = 0.5 * p.w * (alvo - hc);

    }
  }
  if (id === 'renal') {
    if (p.cr && p.age) {
      h += box(p.egfr < 30 ? 'bad' : p.egfr < 60 ? 'warnb' : 'ok', `<b>TFG CKD-EPI 2021</b> (sem raça) = <b>${nf(p.egfr, 0)} mL/min/1,73 m²</b> (${p.egfr >= 90 ? 'G1' : p.egfr >= 60 ? 'G2' : p.egfr >= 45 ? 'G3a' : p.egfr >= 30 ? 'G3b' : p.egfr >= 15 ? 'G4' : 'G5'}).`);
      if (p.clcr) h += box(p.clcr < 30 ? 'bad' : p.clcr < 50 ? 'warnb' : 'ok', `<b>ClCr Cockcroft-Gault</b> = (140 − ${p.age}) × ${nf(p.imc >= 30 ? p.aj : p.w, 1)} kg${p.imc >= 30 ? ' (peso ajustado, IMC ≥30)' : ''} / (72 × ${nf(p.cr, 2)})${p.sex === 'F' ? ' × 0,85' : ''} = <b>${nf(p.clcr, 0)} mL/min</b> — use para <b>ajuste de dose</b> de fármacos.`);
    } else h += `<p class="src">Informe creatinina e idade na barra do paciente.</p>`;
    if (p.h && p.w) {
      h += box('', `<b>Peso predito</b> (ARDSNet/Devine) = ${p.sex === 'M' ? '50' : '45,5'} + 0,91 × (${nf(p.h, 0)} − 152,4) = <b>${nf(p.pp, 1)} kg</b> → VC 6 mL/kg = <b>${nf(6 * p.pp, 0)} mL</b> · 8 mL/kg = ${nf(8 * p.pp, 0)} mL<br>
        IMC = <b>${nf(p.imc, 1)} kg/m²</b> · <b>Peso ajustado</b> = PI + 0,4 × (real − PI) = <b>${nf(p.aj, 1)} kg</b> · SC (Mosteller) = <b>${nf(Math.sqrt(p.h * p.w / 3600), 2)} m²</b>`);
    }
  }
  if (id === 'osm') {
    const na = cv('oNa'), gl = cv('oGli'), ur = cv('oUr'), et = cv('oEt') || 0, med = cv('oMed'), pas = cv('oPas'), pad = cv('oPad'), fc = cv('oFc');
    if (isFinite(na) && isFinite(gl)) {
      const calc = 2 * na + gl / 18 + (isFinite(ur) ? ur / 6 : 0) + et / 3.7, ef = 2 * na + gl / 18;
      h += box('', `Osmolaridade calculada = 2×Na + glicose/18 + ureia/6${et ? ' + etanol/3,7' : ''} = <b>${nf(calc, 0)} mOsm/L</b> · efetiva (tonicidade) = <b>${nf(ef, 0)}</b>${isFinite(med) ? `<br>Gap osmolar = ${nf(med, 0)} − ${nf(calc, 0)} = <b>${nf(med - calc, 0)}</b> ${med - calc > 10 ? '→ <b>aumentado</b>: metanol, etilenoglicol, isopropanol, manitol, cetoacidose/lactato grave' : '(normal ≤10)'}` : ''}`);
    }
    if (isFinite(pas) && isFinite(pad)) h += box('', `PAM = (PAS + 2×PAD)/3 = <b>${nf((pas + 2 * pad) / 3, 0)} mmHg</b>${isFinite(fc) ? ` · Índice de choque (FC/PAS) = <b>${nf(fc / pas, 2)}</b> ${fc / pas >= 1 ? '→ alto risco (hemorragia/choque)' : fc / pas >= 0.8 ? '→ atenção' : ''}` : ''}`);
    if (!h) h = '<p class="src">Preencha os campos.</p>';
  }
  out.innerHTML = h;
}

const SC_ST = { id: 'glasgow', v: {} };
function scoreTotal(s) { const vals = SC_ST.v[s.id] || {}; let t = 0, n = 0; s.itens.forEach((it, i) => { const v = vals[i]; if (v !== undefined && v !== null && v !== false) { t += +v; n++; } }); return { t, n }; }
function scoreHTML() {
  const s = SCORES.find((x) => x.id === SC_ST.id) || SCORES[0];
  const vals = SC_ST.v[s.id] || {};
  const grupos = [...new Set(SCORES.map((x) => x.grupo))];
  let h = `<div class="acc-filter" style="margin-bottom:10px"><label for="scSel" style="margin:0">Escore:</label><select id="scSel" style="max-width:320px">${grupos.map((g) => `<optgroup label="${esc(g)}">${SCORES.filter((x) => x.grupo === g).map((x) => `<option value="${x.id}" ${x.id === s.id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</optgroup>`).join('')}</select><button class="btn btn-line btn-sm" type="button" id="scReset">Limpar</button></div>`;
  h += `<div class="dx-title" style="font-size:1rem">${esc(s.nome)}</div>`;
  h += s.itens.map((it, i) => {
    if (it.o) return `<div class="sc-item"><div class="q">${esc(it.q)}</div><div class="sc-opts">${it.o.map(([l, pts]) => `<button type="button" class="fbtn" data-sc="${i}" data-pts="${pts}" aria-pressed="${vals[i] !== undefined && +vals[i] === pts}">${esc(l)} <span class="src">(${pts > 0 ? '+' : ''}${pts})</span></button>`).join('')}</div></div>`;
    return `<div class="sc-item chk-list"><label><input type="checkbox" data-scc="${i}" ${vals[i] ? 'checked' : ''}> ${esc(it.q)} ${s.custom ? '' : `<span class="src">(${it.c > 0 ? '+' : ''}${nf(it.c, 1)})</span>`}</label></div>`;
  }).join('');
  const { t, n } = scoreTotal(s);
  let res = '';
  if (s.custom === 'ccs') {
    const hi = vals[0], lo = vals[1], rot = vals[2];
    res = hi ? box('bad', '<b>Alto risco → imagem (TC de coluna cervical)</b>') : !lo ? box('bad', '<b>Sem fator de baixo risco que permita testar a mobilidade → imagem</b>') : rot ? box('ok', '<b>Roda 45° para ambos os lados → sem imagem</b>') : box('bad', '<b>Não roda 45° → imagem</b>');
  } else {
    const all = s.itens.every((it, i) => !it.o || it.opt || vals[i] !== undefined);
    const r = s.interp.find((x) => t >= x.lo && t <= x.hi);
    res = `<div class="sc-total"><div class="big-out" style="color:var(--fg)">Total: ${nf(t, 1)}</div>${!all ? '<div class="src">Responda todos os itens de múltipla escolha.</div>' : ''}${r ? box(r.cls, r.txt) : ''}</div>`;
  }
  h += res;
  if (s.nota) h += `<p class="src" style="margin-top:6px">${esc(s.nota)}</p>`;
  h += `<p class="src">Fonte: ${esc(s.fonte)}</p>`;
  return h;
}

  if (t.dataset && t.dataset.cin) { CALC_ST.v[t.id] = t.value; store.set('dc_em_calc', CALC_ST.v); return calcRun(); }
  if (t.dataset && t.dataset.scc !== undefined) { const v = SC_ST.v[SC_ST.id] || (SC_ST.v[SC_ST.id] = {}); const s = SCORES.find((x) => x.id === SC_ST.id); v[t.dataset.scc] = t.checked ? s.itens[+t.dataset.scc].c : false; return renderCalc(); }
  if (t.dataset && t.dataset.exi !== undefined) { const sel = EX_SEL[ST.ex] || (EX_SEL[ST.ex] = {}); sel[t.dataset.exi] = t.checked; const ex = EXX.find((x) => x.id === ST.ex); $('exPre').textContent = exPedido(ex, sel); return; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'ptSex') { renderChips(); return refreshView(); }
  if (t.dataset && t.dataset.pf) return pfUpdate(t);
  if (t.id === 'scSel') { SC_ST.id = t.value; return renderCalc(); }
  if (t.dataset && t.dataset.cin) { CALC_ST.v[t.id] = t.value; store.set('dc_em_calc', CALC_ST.v); return calcRun(); }
});

function pfUpdate(el) {
  const tp = TOPICS.find((x) => x.id === ST.sv); if (!tp || !tp.proc) return;
  (PF_ST[tp.id] || (PF_ST[tp.id] = {}))[el.dataset.pf] = el.value;
  if (el.tagName === 'SELECT') { const y = window.scrollY; renderSv(); window.scrollTo(0, y); return; }
  $('pfOut').textContent = tp.proc.texto(procValues(tp), P());
}
(function init() {
  const s = store.get('dc_em_pt');
  if (s) { if (s.sex) $('ptSex').value = s.sex; if (s.age) $('ptAge').value = s.age; if (s.w) $('ptWeight').value = s.w; if (s.h) $('ptHeight').value = s.h; if (s.cr) $('ptCr').value = s.cr; }
  const sv = store.get('dc_em_sv'); if (sv && TOPICS.some((t) => t.id === sv)) ST.sv = sv;
  const ps = store.get('dc_em_ps'); if (ps && PSX.some((t) => t.id === ps)) ST.ps = ps;
  renderChips(); renderRefs();
  const h = (location.hash || '').replace('#', '');
  setView(VIEWS.includes(h) ? h : store.get('dc_em_view') || 'sv');
})();

</script>
