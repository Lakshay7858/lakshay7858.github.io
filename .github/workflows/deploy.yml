name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A08E6A: ${{ secrets.A08E6A }}
          B8C61A: ${{ secrets.B8C61A }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A08E6A', '')
          meta_b = os.environ.get('B8C61A', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 256722644b85ff778bc1a1 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- b36198c1aee7bf03d8abc3 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
